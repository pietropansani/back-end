<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Tarefas</title>
    <style>
        .concluida { text-decoration: line-through; color: gray; }
    </style>
</head>
<body>
    <h1>Minhas Tarefas</h1>

    <input type="text" id="campo" placeholder="Nova tarefa...">
    <button id="btnAdicionar">Adicionar</button>

    <ul id="lista"></ul>

    <script>
        const campo = document.getElementById('campo');
        const lista = document.getElementById('lista');
        const btnAdicionar = document.getElementById('btnAdicionar');

        // LER: busca as tarefas no servidor e desenha na tela
        async function carregarTarefas() {
            const resposta = await fetch('/tarefas');
            const tarefas = await resposta.json();

            lista.innerHTML = ''; // limpa a lista antes de redesenhar

            tarefas.forEach(tarefa => {
                const li = document.createElement('li');

                // CAIXINHA
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = tarefa.concluida === 1; // <-- lê o valor que está no banco

                checkbox.addEventListener('change', async () => {
                    // ATUALIZAR: manda o novo valor (0 ou 1) e ESPERA o servidor salvar
                    await fetch(`/tarefas/${tarefa.id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ concluida: checkbox.checked ? 1 : 0 })
                    });
                    carregarTarefas(); // só recarrega depois que salvou
                });

                // TEXTO
                const texto = document.createElement('span');
                texto.textContent = ' ' + tarefa.titulo + ' ';
                if (tarefa.concluida === 1) texto.classList.add('concluida');

                // BOTÃO APAGAR
                const btnApagar = document.createElement('button');
                btnApagar.textContent = 'Apagar';
                btnApagar.addEventListener('click', async () => {
                    await fetch(`/tarefas/${tarefa.id}`, { method: 'DELETE' });
                    carregarTarefas();
                });

                li.append(checkbox, texto, btnApagar);
                lista.appendChild(li);
            });
        }

        // CRIAR: envia a tarefa nova para o servidor
        async function adicionarTarefa() {
            const titulo = campo.value.trim();
            if (!titulo) return;

            await fetch('/tarefas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ titulo })
            });

            campo.value = '';
            carregarTarefas();
        }

        btnAdicionar.addEventListener('click', adicionarTarefa);
        campo.addEventListener('keydown', e => { if (e.key === 'Enter') adicionarTarefa(); });

        carregarTarefas(); // desenha a lista quando a página abre
    </script>
</body>
</html>
